name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scripts shell
        run: for f in *.sh; do bash -n "$f"; done && shellcheck *.sh

      - uses: pnpm/action-setup@v4
        if: hashFiles('package.json') != ''
      - uses: actions/setup-node@v4
        if: hashFiles('package.json') != ''
        with:
          node-version: 22
          cache: pnpm
      - name: Interface — install, lint, typecheck, tests, build
        if: hashFiles('package.json') != ''
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm typecheck
          pnpm test --run
          pnpm build

      - uses: dtolnay/rust-toolchain@stable
        if: hashFiles('simulation/Cargo.toml') != ''
        with:
          components: clippy, rustfmt
      - name: Simulation — fmt, clippy, tests
        if: hashFiles('simulation/Cargo.toml') != ''
        working-directory: simulation
        run: |
          cargo fmt --check
          cargo clippy -- -D warnings
          cargo test

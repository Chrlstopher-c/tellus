[package]
name = "tellus_sim"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
name = "tellus_sim"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[features]
node = ["dep:napi", "dep:napi-derive"]

[dependencies]
rayon = "=1.12.0"
serde_json = "=1.0.154"
napi = { version = "=3.16.1", optional = true }
napi-derive = { version = "=3.7.0", optional = true }

[dev-dependencies]
criterion = { version = "=0.5.1", default-features = false }

[[bench]]
name = "grid"
harness = false
